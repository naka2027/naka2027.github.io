<header class="site-header">
  <div class="shell nav">
    <a class="brand" href="{% if page.lang == 'en' %}/en/{% else %}/{% endif %}" aria-label="Naka Research home">
      <span class="brand-monogram">N</span>
      <span class="brand-copy"><b>NAKA</b><small>PM RESEARCH</small></span>
    </a>

    <button class="nav-toggle" type="button" aria-controls="primary-navigation" aria-label="{% if page.lang == 'en' %}Open navigation{% else %}打开导航菜单{% endif %}" aria-expanded="false">{% if page.lang == 'en' %}Menu{% else %}菜单{% endif %}</button>

    <nav id="primary-navigation" class="nav-links" aria-label="{% if page.lang == 'en' %}Primary navigation{% else %}主导航{% endif %}">
      {% if page.lang == 'en' %}
        <a href="/en/">Home</a>
        <a href="/en/questions/">Questions</a>
        <a href="/en/topics/">Topics</a>
        <a href="/en/articles/">Archive</a>
        <a href="/en/project/">Project</a>
        <a href="/en/about/">About</a>
      {% else %}
        <a href="/">首页</a>
        <a href="/questions/">问题解答</a>
        <a href="/topics/">研究专题</a>
        <a href="/articles/">文章归档</a>
        <a href="/project/">项目</a>
        <a href="/about/">关于</a>
      {% endif %}
      <a class="github-link" href="{{ site.github_url }}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      {% if include.switch_url %}
        <a class="lang-switch" href="{{ include.switch_url }}">{% if page.lang == 'en' %}中文{% else %}EN{% endif %}</a>
      {% endif %}
    </nav>
  </div>
</header>
