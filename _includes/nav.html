<header class="site-header">
  <div class="shell nav">
    <a class="brand" href="{% if page.lang == 'en' %}/en/{% else %}/{% endif %}" aria-label="Naka Research home">
      <span class="brand-monogram">N</span>
      <span class="brand-copy"><b>NAKA</b><small>PM RESEARCH</small></span>
    </a>

    <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false">Menu</button>

    <nav class="nav-links" aria-label="Primary navigation">
      {% if page.lang == 'en' %}
        <a href="/en/">Home</a>
        <a href="/en/articles/">Research</a>
        <a href="/en/project/">Project</a>
        <a href="/en/about/">About</a>
      {% else %}
        <a href="/">首页</a>
        <a href="/articles/">研究文章</a>
        <a href="/project/">项目</a>
        <a href="/about/">关于</a>
      {% endif %}
      <a class="github-link" href="{{ site.github_url }}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      {% if include.switch_url %}
        <a class="lang-switch" href="{{ include.switch_url }}">{% if page.lang == 'en' %}中文{% else %}EN{% endif %}</a>
      {% endif %}
    </nav>
  </div>
</header>
